[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msd_chatbots"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "lxml",
    "langchain-core",
    "langchain-huggingface",
    "langchain-milvus",
    "langchain-ollama",
    "langchain-text-splitters",
    "pydantic",
    "pymilvus",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "parsers*"]
